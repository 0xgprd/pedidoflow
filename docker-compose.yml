services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pedidoflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pedidoflow
      POSTGRES_PASSWORD: pedidoflow
      POSTGRES_DB: pedidoflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidoflow -d pedidoflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pedidoflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Levantar opcionalmente con: docker compose --profile tools up
  adminer:
    image: adminer:latest
    container_name: pedidoflow-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data:
