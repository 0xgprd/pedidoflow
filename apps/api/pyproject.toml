[project]
name = "pedidoflow-api"
version = "0.0.1"
description = "Pedidoflow API - SaaS automatización pedidos en Sage 200"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Gabriel Perdomo", email = "gperdomo@quimilock.com" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # ORM + DB
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    # Background jobs
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # AI / Embeddings
    "anthropic>=0.40.0",
    "voyageai>=0.3.0",
    # Storage
    "boto3>=1.35.0",
    # Utils
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM"]
ignore = ["E501"]  # line too long, handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
